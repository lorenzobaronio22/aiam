packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@fontsource-variable/geist": ^5.3.0
  "@hono/node-server": ^2.1.5
  "@hono/zod-validator": ^0.9.1
  "@hookform/resolvers": ^5.9.1
  "@modelcontextprotocol/sdk": ^1.32.1
  "@playwright/test": ^1.64.1
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ^5.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cn: ^0.5.0
  hono: ^4.13.13
  jsdom: ^30.1.3
  lucide-react: ^1.58.0
  next-themes: ^0.4.6
  playwright-bdd: ^9.2.1
  radix-ui: ^1.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-hook-form: ^7.90.0
  shadcn: ^4.22.0
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  zod: ^4.6.7

# esbuild ships a platform binary via postinstall; tsx (used by apps/api) needs it.
# pnpm 11+ expresses build approval as a matcher map (onlyBuiltDependencies was removed).
allowBuilds:
  esbuild: true

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
